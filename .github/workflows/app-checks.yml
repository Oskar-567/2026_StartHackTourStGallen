name: App Checks

on:
  workflow_call:

jobs:
  checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Normally generated by `expo start` (and gitignored by Expo CLI); needed for asset import types.
      - name: Generate expo-env.d.ts
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Typecheck
        run: npx tsc --noEmit
